<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Yakutra Yazılım — Yasal</title>
  <style>
    :root{--bg:#070a14;--panel:#10182b;--ink:#f0f7ff;--muted:#a9b8cc;--cyan:#35e7ff;--gold:#ffc857;--line:#243854}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:
      radial-gradient(circle at 50% -10%,rgba(53,231,255,.16),transparent 32rem),var(--bg);
      color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
    main{width:min(680px,100%);padding:32px;border:3px solid var(--line);background:var(--panel);box-shadow:0 18px 60px rgba(0,0,0,.45)}
    h1{margin:0 0 8px;color:var(--gold);font-size:clamp(28px,7vw,44px);letter-spacing:.04em}
    p{color:var(--muted);margin:0 0 22px}
    a{display:block;padding:16px 18px;border:2px solid var(--line);background:#0a1023;color:var(--cyan);text-decoration:none;font-weight:700}
    a:hover,a:focus{border-color:var(--cyan);outline:none}
    small{display:block;margin-top:20px;color:var(--muted)}
  </style>
</head>
<body>
  <main>
    <h1>Yasal Sayfalar</h1>
    <p>Yakutra Yazılım oyunları için gizlilik ve yasal bilgiler.</p>
    <a href="gravishift/privacy-policy-tr.html">GraviShift: Boyutsal Çekirdek — Gizlilik Politikası</a>
    <small>Son güncelleme: 21 Ekim 2026</small>
  </main>
</body>
</html>
